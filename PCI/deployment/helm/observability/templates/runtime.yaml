{{- $server := required "serverName is required" .Values.serverName -}}
{{- $host := required "pciHost is required" .Values.pciHost -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  jaeger.yaml: |
    extensions:
      jaeger_storage:
        backends:
          pci:
            memory: {max_traces: {{ .Values.maxTraces }}}
      jaeger_query:
        storage: {traces: pci}
        http:
          endpoint: 0.0.0.0:16686
          tls: {cert_file: /tls/tls.crt, key_file: /tls/tls.key, min_version: "1.3", max_version: "1.3"}
        grpc:
          endpoint: 127.0.0.1:16685
          tls: {cert_file: /tls/tls.crt, key_file: /tls/tls.key, min_version: "1.3", max_version: "1.3"}
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 127.0.0.1:14318
            tls: {cert_file: /tls/tls.crt, key_file: /tls/tls.key, min_version: "1.3", max_version: "1.3"}
    processors:
      batch: {timeout: 1s, send_batch_size: 128}
    exporters:
      jaeger_storage_exporter: {trace_storage: pci}
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [jaeger_storage_exporter]}
      telemetry:
        logs: {level: info, encoding: json}
        metrics: {level: none}
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            tls: {cert_file: /tls/tls.crt, key_file: /tls/tls.key, min_version: "1.3", max_version: "1.3"}
      prometheus:
        config:
          scrape_configs:
          - job_name: fap-pci
            scrape_interval: 15s
            scheme: https
            metrics_path: {{ printf "%s/metrics" .Values.pciBasePath | quote }}
            authorization: {type: Bearer, credentials_file: /metrics/token}
            tls_config: {min_version: TLS13, max_version: TLS13}
            static_configs:
            - targets: [{{ $host | quote }}]
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 96, spike_limit_mib: 24}
      batch: {timeout: 1s, send_batch_size: 128}
    exporters:
      otlphttp/jaeger:
        endpoint: https://127.0.0.1:14318
        tls: {ca_file: /tls/ca.crt, server_name_override: {{ $server | quote }}, min_version: "1.3", max_version: "1.3"}
      prometheusremotewrite:
        http:
          endpoint: https://127.0.0.1:9090/api/v1/write
          tls: {ca_file: /tls/ca.crt, server_name_override: {{ $server | quote }}, min_version: "1.3", max_version: "1.3"}
        remote_write_queue: {enabled: true, queue_size: 1000, num_consumers: 1}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/jaeger]}
        metrics: {receivers: [prometheus], processors: [memory_limiter, batch], exporters: [prometheusremotewrite]}
      telemetry:
        logs: {level: info, encoding: json}
        metrics: {level: none}
  prometheus.yaml: |
    global: {scrape_interval: 15s}
    scrape_configs: []
  prometheus-web.yaml: |
    tls_server_config:
      cert_file: /tls/tls.crt
      key_file: /tls/tls.key
      min_version: TLS13
      max_version: TLS13
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        pci.config: {{ toJson .Values | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: jaeger
        image: {{ .Values.images.jaeger | quote }}
        args: ["--config=/config/jaeger.yaml"]
        ports: [{name: jaeger, containerPort: 16686}]
        readinessProbe: {tcpSocket: {port: jaeger}, periodSeconds: 5}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
        volumeMounts: [{name: config, mountPath: /config, readOnly: true}, {name: tls, mountPath: /tls, readOnly: true}]
      - name: collector
        image: {{ .Values.images.collector | quote }}
        args: ["--config=/config/collector.yaml"]
        ports: [{name: otlp, containerPort: 4318}]
        readinessProbe: {tcpSocket: {port: otlp}, periodSeconds: 5}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
        volumeMounts: [{name: config, mountPath: /config, readOnly: true}, {name: tls, mountPath: /tls, readOnly: true}, {name: metrics, mountPath: /metrics, readOnly: true}]
      - name: prometheus
        image: {{ .Values.images.prometheus | quote }}
        args: ["--config.file=/config/prometheus.yaml", "--web.config.file=/config/prometheus-web.yaml", "--web.enable-remote-write-receiver", "--storage.tsdb.path=/prometheus", {{ printf "--storage.tsdb.retention.time=%s" .Values.metricsRetention | quote }}, "--storage.tsdb.retention.size=512MB", "--log.format=json"]
        ports: [{name: prometheus, containerPort: 9090}]
        readinessProbe: {tcpSocket: {port: prometheus}, periodSeconds: 5}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
        volumeMounts: [{name: config, mountPath: /config, readOnly: true}, {name: tls, mountPath: /tls, readOnly: true}, {name: data, mountPath: /prometheus}]
      volumes:
      - name: config
        configMap: {name: {{ .Release.Name }}}
      - name: tls
        secret: {secretName: {{ .Values.tlsSecret }}, defaultMode: 0440}
      - name: metrics
        secret:
          secretName: {{ .Values.metricsSecret }}
          defaultMode: 0440
          items: [{key: {{ .Values.metricsSecretKey }}, path: token}]
      - name: data
        emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: otlp, port: 4318, targetPort: otlp}, {name: jaeger, port: 16686, targetPort: jaeger}, {name: prometheus, port: 9090, targetPort: prometheus}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {{ toJson .Values.orceSelector }}}}]
    ports: [{protocol: TCP, port: 4318}]
