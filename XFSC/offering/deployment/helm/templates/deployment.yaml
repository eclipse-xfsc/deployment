apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "credential-offering-bootstrap.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "credential-offering-bootstrap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "credential-offering-bootstrap.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "credential-offering-bootstrap.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: NATS_ISSUANCE_SUBJECT
              value: {{ .Values.nats.issuanceSubject | quote }}
            - name: CLOUDEVENT_SOURCE
              value: {{ .Values.cloudEvent.source | quote }}
            - name: DEFAULT_TENANT_ID
              value: {{ .Values.defaultTenantId | quote }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: http }
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: http }
          resources:
{{ toYaml .Values.resources | indent 12 }}
