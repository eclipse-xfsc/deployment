nameOverride: ""
fullnameOverride: ""

gatewayClassName: envoy

tenant:
  id: demo_tenant
  subdomain: demo-tenant
  domain: changemedomain
  # DID is always generated as: did:web:<subdomain>.<domain>
  keys:
    verification: eckey
    status: signerkey
  status:
    group: "test"
    type: StatusList2021

# Optional tenant bootstrap in OpenBao.
# The Transit mount defaults to tenant.id and the verification/status keys above
# are created automatically in that mount.
openbao:
  enabled: true
  address: http://openbao.security.svc.cluster.local:8200
  image:
    repository: openbao/openbao
    tag: "2.4.4"
    pullPolicy: IfNotPresent
  auth:
    mount: kubernetes
    role: xfsc-ocm-wstack-resource-provisioner
  serviceAccount:
    create: true
    name: "ocm-wstack-resource-provisioner"
    annotations: {}
  transit:
    # Empty -> tenant.id, e.g. tenant_space/
    mountPath: "ocm-wstack/demo-tenant"
    # Both tenant.keys.verification and tenant.keys.status use this type.
    keyType: ecdsa-p256
    # Optional extra Transit keys created in the same mount.
    # Each entry can override keyType.
    additionalKeys: []
    # - name: another-key
    #   keyType: ed25519
  job:
    annotations: {}
    backoffLimit: 3

gateway:
  annotations: {}
  listenerName: https
  port: 443
  allowedRoutes:
    namespaces:
      from: Same

certificate:
  enabled: true
  secretName: ""
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  duration: ""
  renewBefore: ""
  privateKey:
    algorithm: RSA
    size: 4096

httpRoute:
  annotations: {}
  defaults:
    tenantHeaders: true

# Routing rules:
# - hostname is always <tenant.subdomain>.<tenant.domain>
# - path matching is always Exact
# - /api/<path> automatically rewrites to /v1/tenants/<tenant.id>/<path>
# - targetPath overrides the automatic rewrite for special routes
# - non-/api routes without targetPath are forwarded unchanged
routes:
  - name: credential-issuance
    path: /api/issuance/credential
    backend:
      name: issuance-service
      port: 8080

  # - name: credential-offering
  #   path: /api/offering
  #   backend:
  #     name: credential-retrieval-service
  #     port: 8080

  # - name: offering-create
  #   method: POST
  #   path: /api/offering/create
  #   backend:
  #     name: credential-offering-service
  #     port: 8080

  - name: credential-verification
    path: /api/presentation
    headers: verification
    backend:
      name: credential-verification-service
      port: 8080

  # - name: didcomm
  #   path: /api/didcomm
  #   targetPath: /
  #   backend:
  #     name: didcomm-connector
  #     port: 9090

  - name: openid-configuration
    path: /.well-known/openid-configuration
    backend:
      name: pre-authorization-bridge-service
      port: 8080

  - name: pre-authorization-token
    method: POST
    path: /api/auth/token
    targetPath: /token
    backend:
      name: pre-authorization-bridge-service
      port: 8080

  - name: openid-credential-issuer
    path: /.well-known/openid-credential-issuer
    targetPath: /v1/tenants/tenant_space/.well-known/openid-credential-issuer
    backend:
      name: well-known-service
      port: 8080

  - name: status-list
    path: /api/status
    headers: status
    backend:
      name: status-list-service
      port: 8080

  - name: did-document
    path: /.well-known/did.json
    targetPath: /v1/did/document
    headers: did
    backend:
      name: signer
      port: 8080

  - name: did-configuration
    path: /.well-known/did-configuration.json
    targetPath: /v1/did/configuration
    headers: didConfiguration
    backend:
      name: signer
      port: 8080

  - name: jwks
    path: /.well-known/jwks.json
    targetPath: /v1/jwks
    headers: jwks
    backend:
      name: signer
      port: 8080
