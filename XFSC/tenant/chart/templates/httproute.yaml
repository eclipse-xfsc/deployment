apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "xfsc-tenant-gateway.fullname" . }}
  labels:
    {{- include "xfsc-tenant-gateway.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "xfsc-tenant-gateway.fullname" . }}
      sectionName: {{ .Values.gateway.listenerName | default "https" | quote }}
  hostnames:
    - {{ include "xfsc-tenant-gateway.hostname" . | quote }}
  rules:
  {{- range $route := .Values.routes }}
  {{- $routeEnabled := true }}
  {{- if hasKey $route "enabled" }}{{- $routeEnabled = $route.enabled }}{{- end }}
  {{- if $routeEnabled }}
    {{- $path := required (printf "path is required for route %s" $route.name) $route.path }}
    {{- $targetPath := $route.targetPath | default "" }}
    {{- if and (hasPrefix "/api/" $path) (not $targetPath) }}
      {{- $targetPath = printf "/v1/tenants/%s/%s" (include "xfsc-tenant-gateway.tenantId" $) (trimPrefix "/api/" $path) }}
    {{- end }}
    {{- $headerProfile := $route.headers | default "" }}
    {{- $tenantHeaders := $.Values.httpRoute.defaults.tenantHeaders | default true }}
    {{- if hasKey $route "tenantHeaders" }}{{- $tenantHeaders = $route.tenantHeaders }}{{- end }}
    - name: {{ $route.name | trunc 63 | trimSuffix "-" }}
      matches:
        - path:
            type: Exact
            value: {{ $path | quote }}
          {{- with $route.method }}
          method: {{ . | quote }}
          {{- end }}
      {{- if or $targetPath $tenantHeaders $headerProfile }}
      filters:
        {{- if $targetPath }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $targetPath | quote }}
        {{- end }}
        {{- if or $tenantHeaders $headerProfile }}
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              {{- if $tenantHeaders }}
              - name: X-NAMESPACE
                value: {{ include "xfsc-tenant-gateway.tenantId" $ | quote }}
              {{- end }}
              {{- if eq $headerProfile "did" }}
              - name: X-DID
                value: {{ include "xfsc-tenant-gateway.did" $ | quote }}
              {{- else if eq $headerProfile "verification" }}
              - name: X-DID
                value: {{ include "xfsc-tenant-gateway.did" $ | quote }}
              - name: X-KEY
                value: {{ $.Values.tenant.keys.verification | quote }}
              {{- else if eq $headerProfile "status" }}
              - name: X-DID
                value: {{ include "xfsc-tenant-gateway.did" $ | quote }}
              - name: X-KEY
                value: {{ $.Values.tenant.keys.status | quote }}
              - name: X-GROUP
                value: {{ $.Values.tenant.status.group | default "" | quote }}
              - name: X-HOST
                value: {{ include "xfsc-tenant-gateway.hostname" $ | quote }}
              - name: X-TYPE
                value: {{ $.Values.tenant.status.type | default "StatusList2021" | quote }}
              {{- else if eq $headerProfile "didConfiguration" }}
              - name: X-ORIGIN
                value: {{ include "xfsc-tenant-gateway.hostname" $ | quote }}
              {{- else if eq $headerProfile "jwks" }}
              {{- else if $headerProfile }}
              {{- fail (printf "unknown headers profile %q for route %s" $headerProfile $route.name) }}
              {{- end }}
        {{- end }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ required (printf "backend.name is required for route %s" $route.name) $route.backend.name | quote }}
          port: {{ required (printf "backend.port is required for route %s" $route.name) $route.backend.port }}
          weight: {{ $route.backend.weight | default 1 }}
  {{- end }}
  {{- end }}
