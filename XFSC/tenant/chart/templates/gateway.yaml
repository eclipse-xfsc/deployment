apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "xfsc-tenant-gateway.fullname" . }}
  labels:
    {{- include "xfsc-tenant-gateway.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gatewayClassName is required" .Values.gatewayClassName | quote }}

  listeners:
    - name: http
      hostname: {{ include "xfsc-tenant-gateway.hostname" . | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutes.namespaces.from | default "Same" }}

    - name: {{ .Values.gateway.listenerName | default "https" | quote }}
      hostname: {{ include "xfsc-tenant-gateway.hostname" . | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.port | default 443 }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ include "xfsc-tenant-gateway.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutes.namespaces.from | default "Same" }}