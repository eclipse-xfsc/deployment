name: Docker and Helm

on:
  release:
    types: [published]
  workflow_dispatch:
  
jobs:
  dockerbuild:
    uses: eclipse-xfsc/dev-ops/.github/workflows/dockerbuild.yml@main
    secrets: inherit
    with: 
      dockerfile: "XFSC/deployment-init-container/deployment/docker/Dockerfile"
      harbor_config: "XFSC/deployment-init-container/deployment/harbor.config"
  helm:
    uses: eclipse-xfsc/dev-ops/.github/workflows/helm.yml@main
    secrets: inherit
    with: 
      buildContext:  "XFSC/deployment-init-container/deployment/helm"
      harbor_config: "XFSC/deployment-init-container/deployment/harbor.config"