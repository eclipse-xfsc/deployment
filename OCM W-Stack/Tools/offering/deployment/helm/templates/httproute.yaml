{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "credential-offering-bootstrap.fullname" . }}
spec:
  parentRefs:
{{ toYaml .Values.httpRoute.parentRefs | indent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .Values.httpRoute.path | quote }}
          method: POST
      backendRefs:
        - name: {{ include "credential-offering-bootstrap.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
