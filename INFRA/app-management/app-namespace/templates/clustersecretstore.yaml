{{- if and .Values.openbao.enabled .Values.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "app-namespace.clusterSecretStoreName" . }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
{{- if or .Values.clusterSecretStore.allowedNamespaces .Values.clusterSecretStore.namespaceSelector }}
  conditions:
    - {{- if .Values.clusterSecretStore.allowedNamespaces }}
      namespaces:
{{ toYaml .Values.clusterSecretStore.allowedNamespaces | indent 8 }}
      {{- else }}
      namespaceSelector:
{{ toYaml .Values.clusterSecretStore.namespaceSelector | indent 8 }}
      {{- end }}
{{- end }}
  provider:
    vault:
      server: {{ .Values.openbao.address | quote }}
      path: {{ .Values.openbao.storeMountPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.authMountPath | quote }}
          role: {{ include "app-namespace.storeReaderRole" . | quote }}
          serviceAccountRef:
            name: {{ include "app-namespace.storeReaderServiceAccount" . }}
            namespace: {{ include "app-namespace.targetNamespace" . }}
{{- end }}
