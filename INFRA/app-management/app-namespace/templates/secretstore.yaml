{{- if and .Values.openbao.enabled .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "app-namespace.secretStoreName" . }}
  namespace: {{ include "app-namespace.targetNamespace" . }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider:
    vault:
      server: {{ .Values.openbao.address | quote }}
      path: {{ .Values.openbao.storeMountPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.authMountPath | quote }}
          role: {{ include "app-namespace.storeReaderRole" . | quote }}
          serviceAccountRef:
            name: {{ include "app-namespace.storeReaderServiceAccount" . }}
{{- end }}
