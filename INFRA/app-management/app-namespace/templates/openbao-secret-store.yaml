{{- if and .Values.openbao.enabled .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ .Values.secretStore.namespace | default .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ .Values.openbao.address | quote }}
      path: {{ .Values.openbao.kvPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.mountPath | quote }}
          role: {{ .Values.openbao.role | quote }}
          serviceAccountRef:
            name: {{ .Values.openbao.serviceAccount.name }}
{{- end }}