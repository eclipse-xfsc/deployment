{{- if and .Values.openbao.enabled .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}
  namespace: {{ include "app-namespace.targetNamespace" . }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: openbao-connection
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}

  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}

  target:
    name: {{ .Values.externalSecret.target.name }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}

  data:
    - secretKey: {{ .Values.openbao.bootstrapSecret.vaultAddrKey }}
      remoteRef:
        key: {{ .Values.openbao.bootstrapSecret.path | quote }}
        property: {{ .Values.openbao.bootstrapSecret.vaultAddrKey | quote }}

    - secretKey: {{ .Values.openbao.bootstrapSecret.vaultTokenKey }}
      remoteRef:
        key: {{ .Values.openbao.bootstrapSecret.path | quote }}
        property: {{ .Values.openbao.bootstrapSecret.vaultTokenKey | quote }}
{{- end }}