targetNamespace:
  create: true
  name: infrastructure
  labels:
    xsfc.io/zone: infrastructure

openbao:
  storeMountPath: infrastructure/openbao
  storeSecretPrefix: ""
  resourceProvisioner:
    engineMountPrefix: infrastructure
    serviceAccount:
      name: infrastructure-resource-provisioner
    tokenTTL: 15m
    tokenMaxTTL: 1h
    serviceToken:
      period: 24h
      explicitMaxTTL: 0

clusterSecretStore:
  enabled: true
  name: infrastructure-openbao
  allowedNamespaces: []

secretStore:
  enabled: true
  name: openbao
