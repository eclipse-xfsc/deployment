targetNamespace:
  create: true
  name: catalogue
  labels:
    xsfc.io/zone: catalogue

openbao:
  storeMountPath: apps/catalogue/openbao
  storeSecretPrefix: ""
  resourceProvisioner:
    serviceAccount:
      name: catalogue-resource-provisioner
  storeReader:
    serviceAccount:
      name: catalogue-store-reader
    permissions:
      engineManagement: true
      engineMountPrefix: catalogue

clusterSecretStore:
  enabled: true
  name: catalogue-openbao
  allowedNamespaces: []

secretStore:
  enabled: true
  name: openbao
