openbao:
  enabled: true
  address: "http://openbao.security.svc.cluster.local:8200"
  mountPath: "kubernetes"
  role: "openbao-provisioner"
  kvPath: "tenants"

  serviceAccount:
    name: openbao-provisioner
    namespace: security

clusterSecretStore:
  enabled: true
  name: tenants

secretStore:
  enabled: false
  name: system
  namespace: default