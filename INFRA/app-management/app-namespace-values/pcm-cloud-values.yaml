targetNamespace:
  create: true
  name: pcm-cloud
  labels:
    xsfc.io/zone: pcm-cloud

openbao:
  storeMountPath: apps/pcm-cloud/openbao
  storeSecretPrefix: ""
  resourceProvisioner:
    serviceAccount:
      name: pcm-cloud-resource-provisioner
  storeReader:
    serviceAccount:
      name: pcm-cloud-store-reader
    permissions:
      engineManagement: true
      engineMountPrefix: pcm-cloud

clusterSecretStore:
  enabled: true
  name: pcm-cloud-openbao
  allowedNamespaces: []

secretStore:
  enabled: true
  name: openbao
