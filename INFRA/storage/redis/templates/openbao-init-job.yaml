{{- if .Values.openbaoInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-openbao-init" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: openbao-init
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: openbao-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ required "openbaoInit.serviceAccountName is required" .Values.openbaoInit.serviceAccountName }}
      containers:
        - name: openbao-init
          image: "{{ .Values.openbaoInit.image.repository }}:{{ .Values.openbaoInit.image.tag }}"
          imagePullPolicy: {{ .Values.openbaoInit.image.pullPolicy }}
          env:
            - name: OPENBAO_ADDR
              value: {{ required "openbaoInit.address is required" .Values.openbaoInit.address | quote }}
            - name: OPENBAO_AUTH_PATH
              value: {{ default "kubernetes" .Values.openbaoInit.authPath | quote }}
            - name: OPENBAO_ROLE
              value: {{ required "openbaoInit.role is required" .Values.openbaoInit.role | quote }}
            - name: KV_MOUNT
              value: {{ required "openbaoInit.kv.mount is required" .Values.openbaoInit.kv.mount | quote }}
            - name: KV_SECRET_PATH
              value: {{ include "xfsc-redis-openbao.secretPath" . | quote }}
            - name: SECRET_VALUES
              value: |
{{- range $key, $value := .Values.openbaoInit.values }}
                {{ $key }}={{ $value }}
{{- end }}
            - name: TRANSIT_ENGINES
              value: |
{{- if .Values.openbaoInit.transit.enabled }}
{{- range $engine := .Values.openbaoInit.transit.engines }}
                {{ $engine.mount }}:{{- range $index, $key := $engine.keys }}{{ if $index }},{{ end }}{{ $key.name }}:{{ default "aes256-gcm96" $key.type }}{{- end }}
{{- end }}
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
