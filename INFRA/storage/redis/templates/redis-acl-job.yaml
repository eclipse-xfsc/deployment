{{- if .Values.redisAcl.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-acl-provision" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis-acl-provisioner
  annotations:
    helm.sh/hook: {{ .Values.redisAcl.hook.events | quote }}
    helm.sh/hook-weight: {{ .Values.redisAcl.hook.weight | quote }}
    helm.sh/hook-delete-policy: {{ .Values.redisAcl.hook.deletePolicy | quote }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis-acl-provisioner
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-acl-provision
          image: "{{ .Values.redisAcl.image.repository }}:{{ .Values.redisAcl.image.tag }}"
          imagePullPolicy: {{ .Values.redisAcl.image.pullPolicy }}
          env:
            - name: REDIS_HOST
              value: {{ include "xfsc-redis-openbao.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redisAcl.port | quote }}
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.target.name }}
                  key: redis-password
            - name: REDIS_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.target.name }}
                  key: username
            - name: REDIS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.target.name }}
                  key: password
            - name: REDIS_KEY_PATTERN
              value: {{ .Values.redisAcl.keyPattern | quote }}
            - name: REDIS_COMMANDS
              value: {{ join " " .Values.redisAcl.commands | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}..."

              until REDISCLI_AUTH="$REDIS_ADMIN_PASSWORD" \
                redis-cli \
                  -h "$REDIS_HOST" \
                  -p "$REDIS_PORT" \
                  PING 2>/dev/null \
                | grep -q PONG; do
                sleep 3
              done

              set -- ACL SETUSER "$REDIS_APP_USERNAME" reset on \
                ">$REDIS_APP_PASSWORD" \
                "$REDIS_KEY_PATTERN"

              for command in $REDIS_COMMANDS; do
                set -- "$@" "$command"
              done

              REDISCLI_AUTH="$REDIS_ADMIN_PASSWORD" \
                redis-cli \
                  -h "$REDIS_HOST" \
                  -p "$REDIS_PORT" \
                  "$@"

              echo "Redis ACL user ${REDIS_APP_USERNAME} is ready."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
