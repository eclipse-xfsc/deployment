{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.target.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis-credentials
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.store.name }}
    kind: {{ .Values.externalSecret.store.kind }}
  target:
    name: {{ .Values.externalSecret.target.name }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy }}
  data:
    - secretKey: redis-password
      remoteRef:
        key: {{ include "xfsc-redis-openbao.secretPath" . | quote }}
        property: redis-password
    - secretKey: username
      remoteRef:
        key: {{ include "xfsc-redis-openbao.secretPath" . | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ include "xfsc-redis-openbao.secretPath" . | quote }}
        property: password
{{- end }}
