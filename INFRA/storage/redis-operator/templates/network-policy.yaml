{{- if .Values.wrapper.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
{{- end }}
