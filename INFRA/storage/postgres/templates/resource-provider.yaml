{{- if .Values.resourceProvider.enabled }}
apiVersion: resources.xfsc.io/v1alpha1
kind: ResourceProvider
metadata:
  name: {{ default (printf "%s-postgres" (include "xfsc-postgresql-cnpg.fullname" .)) .Values.resourceProvider.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  type: postgres
  scope: {{ .Values.resourceProvider.scope | quote }}
  description: {{ .Values.resourceProvider.description | quote }}
{{- with .Values.resourceProvider.allow.namespaces }}
  allow:
    namespaces:
{{ toYaml . | indent 6 }}
{{- end }}
  outputs:
    env:
      POSTGRES_HOST: {{ printf "%s-%s.%s.svc.cluster.local" (include "xfsc-postgresql-cnpg.fullname" .) .Values.resourceProvider.serviceSuffix .Release.Namespace | quote }}
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: {{ .Values.resourceProvider.sslMode | quote }}
{{- end }}
