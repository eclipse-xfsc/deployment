apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-openbao-sync" (include "xfsc-postgresql-cnpg.fullname" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-sync
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.openbao.serviceAccount.name }}
      containers:
        - name: sync
          image: "{{ .Values.openbaoInit.image.repository }}:{{ .Values.openbaoInit.image.tag }}"
          imagePullPolicy: {{ .Values.openbaoInit.image.pullPolicy }}
          env:
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.address | quote }}

            - name: OPENBAO_AUTH_PATH
              value: {{ .Values.openbao.authPath | quote }}

            - name: OPENBAO_ROLE
              value: {{ .Values.openbao.role | quote }}

            - name: KV_MOUNT
              value: {{ .Values.openbao.kvMount | quote }}

            - name: KV_SECRET_PATH
              value: {{ include "xfsc-postgresql-cnpg.secretPath" . | quote }}

            - name: SECRET_VALUES
              value: |
{{- range $key, $value := .Values.openbaoSync.values }}
                {{ $key }}={{ $key | upper | replace "." "_" | replace "-" "_" }}
{{- end }}

{{- range $key, $value := .Values.openbaoSync.values }}
            - name: {{ $key | upper | replace "." "_" | replace "-" "_" }}
{{- if kindIs "map" $value }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secretKeyRef.name | quote }}
                  key: {{ $value.secretKeyRef.key | quote }}
{{- else }}
              value: {{ $value | quote }}
{{- end }}
{{- end }}