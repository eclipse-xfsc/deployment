nameOverride: ""
fullnameOverride: ""

openbao:
  address: http://openbao.security.svc.cluster.local:8200
  authPath: kubernetes
  role: xfsc-infrastructure-resource-provisioner
  kvMount: infrastructure
  serviceAccount:
    name: infrastructure-resource-provisioner
  secretStore:
    enabled: true
    name: openbao

openbaoInit:
  enabled: true
  image:
    repository: node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/dev-ops/secret-init-container
    tag: latest
    pullPolicy: Always
  secretPath: ""
  values:
    username: cassandra
    password: '$RANDOM_64'

externalSecret:
  enabled: true
  apiVersion: external-secrets.io/v1
  refreshInterval: 15m
  target:
    name: ""
    creationPolicy: Owner
    deletionPolicy: Retain

cluster:
  enabled: true
  serverVersion: "5.0"
  serverImage: ""
  datacenterName: dc1
  size: 1
  racks:
    - name: rack1
  storage:
    size: 20Gi
    storageClass: ""
  heapSize: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  reaper:
    enabled: false

resourceProvider:
  enabled: true
  name: ""
  scope: Cluster
  description: Cassandra connection provided by this K8ssandra cluster.
  allow:
    namespaces: []
