apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cass.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "cass.headless" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cass.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cass.fullname" . }}
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
          args:
            - |
              cp /scripts/configure.sh /tmp/configure.sh

              sed -i \
                -e 's/cp -a /cp -R --no-preserve=mode,ownership,timestamps /g' \
                -e 's/cp -pR /cp -R --no-preserve=mode,ownership,timestamps /g' \
                -e 's/cp -Rp /cp -R --no-preserve=mode,ownership,timestamps /g' \
                /tmp/configure.sh

              /bin/bash /tmp/configure.sh

              chown -R 999:999 /work
              find /work -type d -exec chmod 0750 {} +
              find /work -type f -exec chmod 0640 {} +

              ls -la /work
              stat /work/cassandra.yaml
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          env:
            # unverändert
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      containers:
        - name: cassandra
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CASSANDRA_CONF
              value: /config
            - name: CASSANDRA_SEEDS
              value: {{ include "cass.seed" . | quote }}
          ports:
            - name: cql
              containerPort: 9042
            - name: internode
              containerPort: 7000
            - name: tls-internode
              containerPort: 7001
            - name: jmx
              containerPort: 7199
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command: [/bin/bash, -ec, 'nodetool statusbinary | grep -q running']
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/bin/bash, -ec, 'nodetool statusbinary | grep -q running']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/bin/bash, -ec, 'nodetool statusbinary | grep -q running']
            initialDelaySeconds: 120
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: [/bin/bash, -ec, 'nodetool drain || true']
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ include "cass.fullname" . }}-config
            defaultMode: 0755
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
{{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
{{- $storageClass := .Values.persistence.storageClass | default .Values.global.storageClass }}
{{- if $storageClass }}
        storageClassName: {{ $storageClass | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
