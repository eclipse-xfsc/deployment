{{- if .Values.resourceProvider.enabled }}
apiVersion: resources.xfsc.io/v1alpha1
kind: ResourceProvider
metadata:
  name: {{ default (printf "%s-cassandra" (include "cass.fullname" .)) .Values.resourceProvider.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  type: cassandra
  scope: {{ .Values.resourceProvider.scope | quote }}
  description: {{ .Values.resourceProvider.description | quote }}
{{- with .Values.resourceProvider.allow.namespaces }}
  allow:
    namespaces:
{{ toYaml . | indent 6 }}
{{- end }}
  outputs:
    env:
      CASSANDRA_HOST: {{ printf "%s-%s-service.%s.svc.cluster.local" (include "cass.fullname" .) .Values.cluster.datacenterName .Release.Namespace | quote }}
      CASSANDRA_PORT: "9042"
      CASSANDRA_DATACENTER: {{ .Values.cluster.datacenterName | quote }}
{{- end }}
