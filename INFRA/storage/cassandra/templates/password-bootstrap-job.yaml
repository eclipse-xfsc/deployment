{{- if .Values.passwordBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-password-bootstrap" (include "cass.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: password-bootstrap
          image: "{{ .Values.passwordBootstrap.image.registry }}/{{ .Values.passwordBootstrap.image.repository }}:{{ .Values.passwordBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.passwordBootstrap.image.pullPolicy }}
          env:
            - name: CASSANDRA_HOST
              value: {{ include "cass.fullname" . | quote }}
            - name: CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cass.authSecret" . }}
                  key: username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cass.authSecret" . }}
                  key: password
          command:
            - /bin/bash
            - -ec
            - |
              until cqlsh "$CASSANDRA_HOST" 9042 -u cassandra -p cassandra -e "SELECT release_version FROM system.local;" >/dev/null 2>&1; do
                if cqlsh "$CASSANDRA_HOST" 9042 -u "$CASSANDRA_USERNAME" -p "$CASSANDRA_PASSWORD" -e "SELECT release_version FROM system.local;" >/dev/null 2>&1; then
                  echo "Administrative password is already configured."
                  exit 0
                fi
                echo "Waiting for Cassandra authentication..."
                sleep 10
              done
              ESCAPED_PASSWORD="$(printf '%s' "$CASSANDRA_PASSWORD" | sed "s/'/''/g")"
              cqlsh "$CASSANDRA_HOST" 9042 -u cassandra -p cassandra \
                -e "ALTER ROLE cassandra WITH PASSWORD = '${ESCAPED_PASSWORD}' AND LOGIN = true;"
              echo "Cassandra administrative password configured."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
{{- end }}
