{{- if .Values.openbaoInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-openbao-init" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ required "openbaoInit.serviceAccountName is required" .Values.openbaoInit.serviceAccountName }}
      containers:
        - name: openbao-init
          image: "{{ .Values.openbaoInit.image.repository }}:{{ .Values.openbaoInit.image.tag }}"
          imagePullPolicy: {{ .Values.openbaoInit.image.pullPolicy }}
          env:
            - name: OPENBAO_ADDR
              value: {{ .Values.openbaoInit.address | quote }}
            - name: OPENBAO_AUTH_PATH
              value: {{ .Values.openbaoInit.authPath | quote }}
            - name: OPENBAO_ROLE
              value: {{ .Values.openbaoInit.role | quote }}
            - name: KV_MOUNT
              value: {{ .Values.openbaoInit.kv.mount | quote }}
            - name: KV_SECRET_PATH
              value: {{ include "xfsc-minio.secretPath" . | quote }}
            - name: SECRET_VALUES
              value: |
{{- range $key, $value := .Values.openbaoInit.values }}
                {{ $key }}={{ $value }}
{{- end }}
            - name: TRANSIT_ENGINES
              value: |
{{- if .Values.openbaoInit.transit.enabled }}
{{- range $engine := .Values.openbaoInit.transit.engines }}
                {{ $engine.mount }}:{{- range $i, $key := $engine.keys }}{{ if $i }},{{ end }}{{ $key.name }}:{{ default "aes256-gcm96" $key.type }}{{- end }}
{{- end }}
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
