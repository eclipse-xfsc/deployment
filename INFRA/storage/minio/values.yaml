minio:
  auth:
    existingSecret: minio-credentials
  mode: standalone
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  statefulset:
    replicaCount: 1

  service:
    type: ClusterIP
    port: 9000

  consoleService:
    type: ClusterIP
    port: 9001