{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "git.bootstrapName" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "git.bootstrapName" . }}
    spec:
      serviceAccountName: {{ include "git.bootstrapName" . }}
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          command: ["python", "/bootstrap/bootstrap.py"]
          env:
            - name: GITEA_URL
              value: {{ .Values.bootstrap.giteaUrl | quote }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
            - name: CONTROLLER_USER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-bootstrap" .Values.bootstrap.outputSecret.name }}
                  key: username
            - name: CONTROLLER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-bootstrap" .Values.bootstrap.outputSecret.name }}
                  key: password
            - name: CONTROLLER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-bootstrap" .Values.bootstrap.outputSecret.name }}
                  key: email
            - name: ORG_NAME
              value: {{ .Values.bootstrap.organization.name | quote }}
            - name: ORG_DESCRIPTION
              value: {{ .Values.bootstrap.organization.description | quote }}
            - name: REPO_NAME
              value: {{ .Values.bootstrap.repository.name | quote }}
            - name: REPO_DESCRIPTION
              value: {{ .Values.bootstrap.repository.description | quote }}
            - name: REPO_PRIVATE
              value: {{ .Values.bootstrap.repository.private | quote }}
            - name: TOKEN_NAME
              value: {{ .Values.bootstrap.token.name | quote }}
            - name: TOKEN_SCOPES
              value: {{ join "," .Values.bootstrap.token.scopes | quote }}
            - name: OUTPUT_SECRET
              value: {{ .Values.bootstrap.outputSecret.name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "git.bootstrapName" . }}
{{- end }}
