{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "git.bootstrapName" . }}
data:
  bootstrap.py: |
    import base64
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    GITEA_URL = os.environ["GITEA_URL"].rstrip("/")
    ADMIN_USER = os.environ["ADMIN_USER"]
    ADMIN_PASSWORD = os.environ["ADMIN_PASSWORD"]
    CONTROLLER_USER = os.environ["CONTROLLER_USER"]
    CONTROLLER_PASSWORD = os.environ["CONTROLLER_PASSWORD"]
    CONTROLLER_EMAIL = os.environ["CONTROLLER_EMAIL"]
    ORG_NAME = os.environ["ORG_NAME"]
    ORG_DESCRIPTION = os.environ["ORG_DESCRIPTION"]
    REPO_NAME = os.environ["REPO_NAME"]
    REPO_DESCRIPTION = os.environ["REPO_DESCRIPTION"]
    REPO_PRIVATE = os.environ["REPO_PRIVATE"].lower() == "true"
    TOKEN_NAME = os.environ["TOKEN_NAME"]
    TOKEN_SCOPES = [s for s in os.environ.get("TOKEN_SCOPES", "").split(",") if s]
    OUTPUT_SECRET = os.environ["OUTPUT_SECRET"]
    NAMESPACE = os.environ["POD_NAMESPACE"]

    def request(method, path, auth=None, body=None, headers=None, expected=(200, 201, 204)):
        url = GITEA_URL + path
        data = None if body is None else json.dumps(body).encode()
        req_headers = {"Accept": "application/json"}
        if body is not None:
            req_headers["Content-Type"] = "application/json"
        if headers:
            req_headers.update(headers)
        if auth:
            token = base64.b64encode(f"{auth[0]}:{auth[1]}".encode()).decode()
            req_headers["Authorization"] = f"Basic {token}"
        req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=15) as response:
                payload = response.read()
                parsed = json.loads(payload) if payload else None
                if response.status not in expected:
                    raise RuntimeError(f"{method} {path}: HTTP {response.status}: {parsed}")
                return response.status, parsed
        except urllib.error.HTTPError as error:
            payload = error.read().decode(errors="replace")
            try:
                parsed = json.loads(payload) if payload else None
            except json.JSONDecodeError:
                parsed = payload
            return error.code, parsed

    def wait_for_gitea():
        for _ in range(120):
            status, _ = request("GET", "/api/healthz", expected=(200,))
            if status == 200:
                print("Gitea is ready.")
                return
            time.sleep(2)
        raise RuntimeError("Gitea did not become ready in time.")

    def ensure_controller_user():
        status, _ = request(
            "GET",
            f"/api/v1/users/{urllib.parse.quote(CONTROLLER_USER)}",
            auth=(ADMIN_USER, ADMIN_PASSWORD),
            expected=(200, 404),
        )
        if status == 200:
            print(f"User {CONTROLLER_USER} already exists.")
            return

        status, payload = request(
            "POST",
            "/api/v1/admin/users",
            auth=(ADMIN_USER, ADMIN_PASSWORD),
            body={
                "username": CONTROLLER_USER,
                "email": CONTROLLER_EMAIL,
                "password": CONTROLLER_PASSWORD,
                "must_change_password": False,
                "send_notify": False,
                "source_id": 0,
                "login_name": CONTROLLER_USER,
            },
            expected=(201,),
        )
        if status != 201:
            raise RuntimeError(f"Cannot create user: {status}: {payload}")
        print(f"Created user {CONTROLLER_USER}.")

    def ensure_organization():
        status, _ = request(
            "GET",
            f"/api/v1/orgs/{urllib.parse.quote(ORG_NAME)}",
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            expected=(200, 404),
        )
        if status == 200:
            print(f"Organization {ORG_NAME} already exists.")
            return

        status, payload = request(
            "POST",
            "/api/v1/orgs",
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            body={
                "username": ORG_NAME,
                "full_name": ORG_NAME,
                "description": ORG_DESCRIPTION,
                "visibility": "public",
                "repo_admin_change_team_access": True,
            },
            expected=(201,),
        )
        if status != 201:
            raise RuntimeError(f"Cannot create organization: {status}: {payload}")
        print(f"Created organization {ORG_NAME}.")

    def ensure_repository():
        path = f"/api/v1/repos/{urllib.parse.quote(ORG_NAME)}/{urllib.parse.quote(REPO_NAME)}"
        status, _ = request(
            "GET",
            path,
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            expected=(200, 404),
        )
        if status == 200:
            print(f"Repository {ORG_NAME}/{REPO_NAME} already exists.")
            return

        status, payload = request(
            "POST",
            f"/api/v1/orgs/{urllib.parse.quote(ORG_NAME)}/repos",
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            body={
                "name": REPO_NAME,
                "description": REPO_DESCRIPTION,
                "private": REPO_PRIVATE,
                "auto_init": True,
                "default_branch": "main",
                "gitignores": "",
                "license": "",
                "readme": "Default",
            },
            expected=(201,),
        )
        if status != 201:
            raise RuntimeError(f"Cannot create repository: {status}: {payload}")
        print(f"Created repository {ORG_NAME}/{REPO_NAME}.")

    def ensure_directory_marker(path, content):
        api_path = (
            f"/api/v1/repos/{urllib.parse.quote(ORG_NAME)}/"
            f"{urllib.parse.quote(REPO_NAME)}/contents/{urllib.parse.quote(path, safe='/')}"
        )
        status, _ = request(
            "GET",
            api_path,
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            expected=(200, 404),
        )
        if status == 200:
            return

        status, payload = request(
            "POST",
            api_path,
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            body={
                "branch": "main",
                "content": base64.b64encode(content.encode()).decode(),
                "message": f"Initialize {path}",
            },
            expected=(201,),
        )
        if status != 201:
            raise RuntimeError(f"Cannot create {path}: {status}: {payload}")

    def create_access_token():
        status, tokens = request(
            "GET",
            f"/api/v1/users/{urllib.parse.quote(CONTROLLER_USER)}/tokens",
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            expected=(200,),
        )
        if status != 200:
            raise RuntimeError(f"Cannot list access tokens: {status}: {tokens}")

        for token in tokens or []:
            if token.get("name") == TOKEN_NAME:
                token_id = token.get("id")
                delete_status, payload = request(
                    "DELETE",
                    f"/api/v1/users/{urllib.parse.quote(CONTROLLER_USER)}/tokens/{token_id}",
                    auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
                    expected=(204,),
                )
                if delete_status != 204:
                    raise RuntimeError(f"Cannot replace old token: {delete_status}: {payload}")

        body = {"name": TOKEN_NAME}
        if TOKEN_SCOPES:
            body["scopes"] = TOKEN_SCOPES

        status, payload = request(
            "POST",
            f"/api/v1/users/{urllib.parse.quote(CONTROLLER_USER)}/tokens",
            auth=(CONTROLLER_USER, CONTROLLER_PASSWORD),
            body=body,
            expected=(201,),
        )
        if status != 201 or not payload or not payload.get("sha1"):
            raise RuntimeError(f"Cannot create access token: {status}: {payload}")
        return payload["sha1"]

    def kubernetes_request(method, path, body=None, expected=(200, 201)):
        host = os.environ.get("KUBERNETES_SERVICE_HOST")
        port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
        token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        context = ssl.create_default_context(cafile=ca_file)
        data = None if body is None else json.dumps(body).encode()
        headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
        if body is not None:
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(
            f"https://{host}:{port}{path}",
            data=data,
            headers=headers,
            method=method,
        )
        try:
            with urllib.request.urlopen(req, context=context, timeout=15) as response:
                payload = response.read()
                parsed = json.loads(payload) if payload else None
                return response.status, parsed
        except urllib.error.HTTPError as error:
            payload = error.read().decode(errors="replace")
            try:
                parsed = json.loads(payload) if payload else None
            except json.JSONDecodeError:
                parsed = payload
            return error.code, parsed

    def write_output_secret(access_token):
        secret_path = (
            f"/api/v1/namespaces/{urllib.parse.quote(NAMESPACE)}/"
            f"secrets/{urllib.parse.quote(OUTPUT_SECRET)}"
        )
        collection_path = f"/api/v1/namespaces/{urllib.parse.quote(NAMESPACE)}/secrets"

        data = {
            "username": base64.b64encode(CONTROLLER_USER.encode()).decode(),
            "password": base64.b64encode(CONTROLLER_PASSWORD.encode()).decode(),
            "token": base64.b64encode(access_token.encode()).decode(),
            "url": base64.b64encode(GITEA_URL.encode()).decode(),
            "repository": base64.b64encode(
                f"{GITEA_URL}/{ORG_NAME}/{REPO_NAME}.git".encode()
            ).decode(),
        }

        secret = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
                "name": OUTPUT_SECRET,
                "namespace": NAMESPACE,
                "labels": {
                    "app.kubernetes.io/managed-by": "gitea-bootstrap",
                },
            },
            "type": "Opaque",
            "data": data,
        }

        status, _ = kubernetes_request("GET", secret_path, expected=(200, 404))
        if status == 404:
            status, payload = kubernetes_request("POST", collection_path, secret)
            if status != 201:
                raise RuntimeError(f"Cannot create output secret: {status}: {payload}")
            print(f"Created Kubernetes secret {OUTPUT_SECRET}.")
            return

        if status != 200:
            raise RuntimeError(f"Cannot read output secret: HTTP {status}")

        status, payload = kubernetes_request("PUT", secret_path, secret)
        if status != 200:
            raise RuntimeError(f"Cannot update output secret: {status}: {payload}")
        print(f"Updated Kubernetes secret {OUTPUT_SECRET}.")

    def main():
        wait_for_gitea()
        ensure_controller_user()
        ensure_organization()
        ensure_repository()
        ensure_directory_marker(
            "products/.gitkeep",
            "# Product definitions are stored below this directory.\n",
        )
        ensure_directory_marker(
            "tenants/.gitkeep",
            "# Generated tenant definitions are stored below this directory.\n",
        )
        access_token = create_access_token()
        write_output_secret(access_token)
        print("Gitea bootstrap completed successfully.")

    if __name__ == "__main__":
        try:
            main()
        except Exception as error:
            print(f"Bootstrap failed: {error}", file=sys.stderr)
            raise
{{- end }}
