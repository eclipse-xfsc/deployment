{{- if .Values.bootstrap.enabled }}
{{- $name := printf "%s-bootstrap" .Values.bootstrap.outputSecret.name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 48 -}}
{{- if $existing -}}
{{- $password = (index $existing.data "password" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  username: {{ .Values.bootstrap.controller.username | quote }}
  password: {{ $password | quote }}
  email: {{ .Values.bootstrap.controller.email | quote }}
{{- end }}
