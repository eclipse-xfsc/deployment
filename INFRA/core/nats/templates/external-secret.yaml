{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "xfsc-nats.authSecret" . }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.openbao.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ include "xfsc-nats.authSecret" . }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ include "xfsc-nats.secretPath" . | quote }}
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: password
      remoteRef:
        key: {{ include "xfsc-nats.secretPath" . | quote }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}