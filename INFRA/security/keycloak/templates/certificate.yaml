{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-auth
spec:
  secretName: {{ .Values.certificate.secretName | default (printf "%s-auth-tls" .Release.Name) }}
  dnsNames:
    - {{ printf "auth.%s" .Values.domain | quote }}
  issuerRef:
    {{- toYaml .Values.certificate.issuerRef | nindent 4 }}
  privateKey:
    {{- toYaml .Values.certificate.privateKey | nindent 4 }}
  {{- with .Values.certificate.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.certificate.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}