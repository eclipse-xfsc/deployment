{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-auth
  annotations:
    {{- toYaml .Values.httpRoute.annotations | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .Release.Name }}-auth
      sectionName: {{ .Values.listenerSet.listenerName | quote }}
  hostnames:
    - {{ printf "auth.%s" .Values.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.httpRoute.backend.serviceName | quote }}
          port: {{ .Values.httpRoute.backend.port }}
{{- end }}