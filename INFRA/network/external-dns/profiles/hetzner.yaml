external-dns:
  provider:
    name: webhook
    webhook:
      image:
        repository: docker.io/hetzner/external-dns-hetzner-webhook
        tag: v1.0.2
      env:
        - name: HETZNER_TOKEN
          valueFrom:
            secretKeyRef:
              name: external-dns
              key: token

  domainFilters:
    - example.com