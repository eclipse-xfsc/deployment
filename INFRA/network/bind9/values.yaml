bind9:
  name: bind
  image:
    repository: internetsystemsconsortium/bind9
    tag: "9.20"
  service:
    type: LoadBalancer
    annotations:
      load-balancer.hetzner.cloud/network-zone: eu-central
  persistence:
    size: 10Gi

externalSecret:
  enabled: true
  apiVersion: external-secrets.io/v1
  refreshInterval: 15m
  target:
    creationPolicy: Owner
    deletionPolicy: Retain

openbao:
  address: http://openbao.security.svc.cluster.local:8200
  authPath: kubernetes
  role: xfsc-infrastructure-resource-provisioner
  kvMount: infrastructure
  serviceAccount:
    name: infrastructure-resource-provisioner
  secretStore:
    enabled: true
    name: openbao

tsig:
  existingSecret: dns-tsig
  key: tsig-secret
  keyName: externaldns
  algorithm: hmac-sha256

openbaoInit:
  enabled: true
  image:
    repository: node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/dev-ops/secret-init-container
    tag: latest
    pullPolicy: Always
  secretPath: "network/tsig"
  values:
    tsig-secret: '$RANDOM_64'

dns:
  hostmaster: hostmaster
  zones:
    - domain: example.com
      ns:
        - ns1.example.com.
      records:
        - name: ns1
          type: A
          value: 0.0.0.0
