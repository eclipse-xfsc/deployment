apiVersion: v1
kind: ConfigMap
metadata:
  name: bind9-config
data:
  named.conf: |
    options {
      directory "/etc/bind";
      listen-on port 53 { any; };
      listen-on-v6 port 53 { any; };
      recursion no;
      allow-query { any; };
      allow-transfer { none; };
    };

    key "{{ .Values.tsig.keyName }}" {
      algorithm {{ .Values.tsig.algorithm }};
      secret "__TSIG__";
    };

{{- range .Values.dns.zones }}
    zone "{{ .domain }}" {
      type master;
      file "{{ .domain }}.zone";
      update-policy {
        grant "{{ $.Values.tsig.keyName }}" zonesub ANY;
      };
    };
{{- end }}

{{- range .Values.dns.zones }}
  {{ .domain }}.zone: |
    $TTL 300
    @ IN SOA {{ index .ns 0 }} {{ $.Values.dns.hostmaster }}.{{ .domain }}. (
      2026072401
      3600
      600
      1209600
      300
    )
{{- range .ns }}
    @ IN NS {{ . }}
{{- end }}
{{- range .records }}
    {{ .name }} IN {{ .type }} {{ .value }}
{{- end }}

{{- end }}